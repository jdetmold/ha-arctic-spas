name: Validate

on:
  push:
    branches: [main]
  pull_request:

# Opt all JS-based actions in to Node 24 ahead of the June 2026 default flip.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hacs/action@main
        with:
          category: integration

  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy mypy-protobuf types-protobuf pytest pytest-asyncio protobuf
      - name: Ruff
        run: ruff check .
      - name: MyPy (library only)
        run: mypy custom_components/arctic_spa_local/pyarcticspa
      - name: Pytest (protocol library)
        run: PYTHONPATH=. pytest tests/pyarcticspa/ -v
