<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <radialGradient id="water" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="60%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#075985"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="bubble" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.55"/>
    </radialGradient>
  </defs>

  <!-- Tub rim (outer) -->
  <circle cx="128" cy="128" r="116" fill="url(#rim)"/>
  <!-- Highlight on rim -->
  <circle cx="128" cy="128" r="116" fill="none" stroke="#94a3b8" stroke-width="2" opacity="0.5"/>
  <!-- Water surface -->
  <circle cx="128" cy="128" r="100" fill="url(#water)"/>

  <!-- Subtle water ripple ring -->
  <circle cx="128" cy="128" r="78" fill="none" stroke="#e0f7fa" stroke-width="2" opacity="0.18"/>
  <circle cx="128" cy="128" r="56" fill="none" stroke="#e0f7fa" stroke-width="2" opacity="0.12"/>

  <!-- Three jet bubble clusters arranged at 12 / 4 / 8 o'clock -->
  <!-- Top cluster -->
  <g>
    <circle cx="128" cy="68" r="14" fill="url(#bubble)"/>
    <circle cx="110" cy="80" r="7"  fill="url(#bubble)"/>
    <circle cx="148" cy="80" r="9"  fill="url(#bubble)"/>
    <circle cx="124" cy="92" r="5"  fill="url(#bubble)"/>
  </g>
  <!-- Lower-right cluster -->
  <g>
    <circle cx="180" cy="160" r="14" fill="url(#bubble)"/>
    <circle cx="166" cy="148" r="7"  fill="url(#bubble)"/>
    <circle cx="196" cy="172" r="6"  fill="url(#bubble)"/>
    <circle cx="172" cy="178" r="5"  fill="url(#bubble)"/>
  </g>
  <!-- Lower-left cluster -->
  <g>
    <circle cx="76"  cy="160" r="14" fill="url(#bubble)"/>
    <circle cx="60"  cy="172" r="6"  fill="url(#bubble)"/>
    <circle cx="92"  cy="148" r="7"  fill="url(#bubble)"/>
    <circle cx="84"  cy="178" r="5"  fill="url(#bubble)"/>
  </g>
</svg>
