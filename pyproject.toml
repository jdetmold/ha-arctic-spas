[project]
name = "ha-arctic-spas"
version = "0.1.0"
description = "Home Assistant custom integration for Arctic Spa hot tubs"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Jeff", email = "jeff@techyyc.com"}]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["custom_components/arctic_spa/pyarcticspa/proto"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "ASYNC", "PT"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
explicit_package_bases = true
mypy_path = "."
exclude = ["custom_components/arctic_spa/pyarcticspa/proto/.*"]

# pyarcticspa is the only package we type-check. The HA integration
# modules (coordinator.py, climate.py, etc.) require the homeassistant
# package which is not installed in the lint environment, so silence
# them via override.
[[tool.mypy.overrides]]
module = [
    "custom_components.arctic_spa",
    "custom_components.arctic_spa.binary_sensor",
    "custom_components.arctic_spa.button",
    "custom_components.arctic_spa.climate",
    "custom_components.arctic_spa.config_flow",
    "custom_components.arctic_spa.const",
    "custom_components.arctic_spa.coordinator",
    "custom_components.arctic_spa.diagnostics",
    "custom_components.arctic_spa.entity",
    "custom_components.arctic_spa.select",
    "custom_components.arctic_spa.sensor",
    "custom_components.arctic_spa.switch",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = "custom_components.arctic_spa.pyarcticspa.proto.*"
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
